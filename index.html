<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSim — 주식 매수 전략 시뮬레이터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- ── 왼쪽 사이드바 ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">📈 StockSim</div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="chart">
        <span class="nav-icon">📊</span>
        <span>차트</span>
      </button>
      <button class="nav-item" data-view="sim">
        <span class="nav-icon">💹</span>
        <span>시뮬레이터</span>
      </button>
    </nav>
    <div class="sidebar-footer">Yahoo Finance</div>
  </aside>

  <!-- ── 중앙 메인 ── -->
  <main class="main-panel">

    <!-- 차트 뷰 -->
    <div id="view-chart" class="view active">
      <div class="chart-header">
        <div class="chart-search">
          <div class="search-name-wrap">
            <input id="name-input" type="text" placeholder="종목명 검색 (예: 삼성전자, Apple, 도요타)" autocomplete="off" />
            <div id="name-suggestions" class="suggestions hidden"></div>
          </div>
          <button id="btn-search">조회</button>
        </div>
        <div id="stock-info" class="stock-info hidden"></div>
      </div>

      <div class="chart-controls">
        <div class="chart-controls-top">
          <div class="period-tabs">
            <button class="period-tab" data-period-group="min">분봉 ▾</button>
            <button class="period-tab active" data-period="D">일봉</button>
            <button class="period-tab" data-period="W">주봉</button>
            <button class="period-tab" data-period="M">월봉</button>
            <button class="period-tab" data-period="Y">년봉</button>
          </div>
          <button id="btn-to-sim" class="btn-sim-link hidden">💹 이 종목으로 시뮬레이터</button>
        </div>
        <div id="min-tabs" class="min-tabs hidden">
          <button class="min-tab" data-period="1분">1분</button>
          <button class="min-tab" data-period="3분">3분</button>
          <button class="min-tab" data-period="5분">5분</button>
          <button class="min-tab" data-period="10분">10분</button>
          <button class="min-tab" data-period="15분">15분</button>
          <button class="min-tab" data-period="30분">30분</button>
        </div>
      </div>

      <div id="chart-container" class="chart-container">
        <div id="chart-empty" class="chart-empty">
          <p>📊</p>
          <p>종목을 검색하면 차트가 표시됩니다</p>
          <p class="chart-empty-hint">005930 · AAPL · 7203 · 600519</p>
        </div>
        <div id="chart-loading" class="chart-loading hidden">불러오는 중...</div>
      </div>
    </div>

    <!-- 시뮬레이터 뷰 -->
    <div id="view-sim" class="view hidden">
      <div class="sim-scroll">
        <div class="sim-header">
          <h2>💹 매수 전략 시뮬레이터</h2>
          <div id="sim-stock-badge" class="sim-stock-badge hidden"></div>
        </div>

        <div class="card">
          <span class="card-title">🛒 첫 매수</span>
          <div class="field-row">
            <div class="field"><label>매수가</label><input id="first-price" type="number" min="0" placeholder="예: 50000" /></div>
            <div class="field"><label>수량 (주)</label><input id="first-qty" type="number" min="0" placeholder="예: 100" /></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title-row">
            <span class="card-title">➕ 추가 매수 계획</span>
            <button id="btn-add-step" class="btn-add">+ 단계 추가</button>
          </div>
          <div id="steps-list"></div>
          <p id="steps-empty" class="empty-hint">단계 추가 버튼으로 추가 매수 계획을 입력하세요</p>
        </div>

        <div class="card">
          <span class="card-title">🎯 손절 / 목표가</span>
          <div class="field-row">
            <div class="field"><label>손절가</label><input id="stop-loss" type="number" min="0" placeholder="선택 입력" /></div>
            <div class="field"><label>목표 매도가</label><input id="target-price" type="number" min="0" placeholder="선택 입력" /></div>
          </div>
        </div>

        <div class="card">
          <span class="card-title">💹 현재가 평가</span>
          <div class="field"><label>현재 주가</label><input id="current-price" type="number" min="0" placeholder="검색으로 자동 입력 또는 직접 입력" /></div>
        </div>

        <div id="result-panel">
          <div class="result-empty"><p>📊</p><p>매수가와 수량을 입력하면<br>결과가 여기에 표시됩니다</p></div>
        </div>
      </div>
    </div>

  </main>

  <!-- ── 오른쪽 시총 순위 ── -->
  <aside class="right-panel">
    <div class="rankings-title">🏆 시가총액 Top 20</div>
    <div class="rank-tabs">
      <button class="rank-tab active" data-market="KR">🇰🇷 한국</button>
      <button class="rank-tab" data-market="US">🇺🇸 미국</button>
      <button class="rank-tab" data-market="CN">🇨🇳 중국</button>
      <button class="rank-tab" data-market="JP">🇯🇵 일본</button>
    </div>
    <div id="rank-loading" class="rank-loading">불러오는 중...</div>
    <div id="rank-list"></div>
    <div id="rank-updated" class="rank-updated"></div>
  </aside>

</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="script.js?v=8"></script>

</body>
</html>
